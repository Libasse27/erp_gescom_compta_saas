# Nom de projet Compose explicite : sans lui, Compose dérive un nom de
# projet du dossier du fichier ("docker"), IDENTIQUE à celui de
# docker-compose.dev.yml — deux stacks partageant alors le même espace de
# noms internes, chacune "recréant" (donc détruisant) les conteneurs de
# l'autre au moindre `up`. Vécu en vérifiant cette Phase 10.1 : `up -d
# postgres` sur ce fichier a détruit le conteneur postgres de dev
# (heureusement le volume nommé, distinct, a survécu).
name: erp_saas_prod

# P-04 (docs/audit/PRODUCTION-READINESS.md) : `mem_limit`/`cpus` plutôt que
# `deploy.resources.limits` — ce dernier n'est honoré qu'en mode Swarm
# (`docker stack deploy`), ignoré silencieusement par `docker compose up`
# tel qu'utilisé ici (scripts/prod-post-deploy.sh). Valeurs par défaut
# conservatrices pour un VPS mutualisé (docs/deployment/PRODUCTION.md),
# overridables sans modifier ce fichier via docker/.env.prod
# (POSTGRES_MEM_LIMIT, API_MEM_LIMIT, ...) une fois le VPS cible connu.
services:
  postgres:
    image: postgres:16-alpine
    container_name: erp_saas_postgres_prod
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM_LIMIT:-1024m}
    cpus: ${POSTGRES_CPU_LIMIT:-1.0}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - erp_saas_postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - erp_saas_prod

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: erp_saas_api_prod
    restart: unless-stopped
    mem_limit: ${API_MEM_LIMIT:-512m}
    cpus: ${API_CPU_LIMIT:-1.0}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Réservée à `prisma migrate deploy` (exécuté via `docker compose run`,
      # voir scripts/prod-post-deploy.sh) — PrismaService ne s'y connecte
      # plus depuis la correction de MT-01, mais Prisma Migrate la lit
      # directement depuis l'environnement du conteneur au démarrage normal
      # aussi ; on la laisse donc présente pour ne pas casser un `migrate
      # deploy` relancé manuellement depuis ce même service.
      DATABASE_URL: ${DATABASE_URL}
      IDENTITY_DATABASE_URL: ${IDENTITY_DATABASE_URL}
      TENANT_DATABASE_URL: ${TENANT_DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      PORT: 3000
      PAYMENT_WEBHOOK_SECRET_WAVE: ${PAYMENT_WEBHOOK_SECRET_WAVE}
      PAYMENT_WEBHOOK_SECRET_ORANGE_MONEY: ${PAYMENT_WEBHOOK_SECRET_ORANGE_MONEY}
      PAYMENT_WEBHOOK_SECRET_FREE_MONEY: ${PAYMENT_WEBHOOK_SECRET_FREE_MONEY}
      PAYMENT_WEBHOOK_SECRET_STRIPE: ${PAYMENT_WEBHOOK_SECRET_STRIPE}
      PAYMENT_WEBHOOK_SECRET_CARD: ${PAYMENT_WEBHOOK_SECRET_CARD}
      PAYMENT_GRACE_PERIOD_DAYS: ${PAYMENT_GRACE_PERIOD_DAYS}
      PAYMENT_WEBHOOK_REPLAY_TOLERANCE_SECONDS: ${PAYMENT_WEBHOOK_REPLAY_TOLERANCE_SECONDS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # P-08 (docs/audit/PRODUCTION-READINESS.md) : optionnel, désactivé par
      # défaut (voir apps/api/src/instrument.ts) — vide si non renseigné dans
      # docker/.env.prod, docs/deployment/MONITORING.md.
      SENTRY_DSN: ${SENTRY_DSN:-}
    # Pas de port publié sur l'hôte (Phase 10.6, docs/adr/0017-...) : Caddy
    # est désormais le seul point d'entrée externe, il joint ce service par
    # son nom sur le réseau Docker interne (reverse_proxy api:3000).
    # GET /health (Phase 10.5) — pas de curl/wget dans l'image runner
    # (Alpine minimal), Node lui-même fait la requête pour ne pas ajouter de
    # paquet uniquement pour ça.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - erp_saas_prod

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: erp_saas_web_prod
    restart: unless-stopped
    mem_limit: ${WEB_MEM_LIMIT:-256m}
    cpus: ${WEB_CPU_LIMIT:-0.5}
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      # P-08 (docs/audit/PRODUCTION-READINESS.md) : optionnel, désactivé par
      # défaut (voir apps/web/src/instrumentation.ts) — vide si non renseigné
      # dans docker/.env.prod, docs/deployment/MONITORING.md.
      SENTRY_DSN: ${SENTRY_DSN:-}
    # Même remarque que le service api : pas de port publié, Caddy joint ce
    # service par son nom sur le réseau Docker interne.
    # GET /login (P-05, docs/audit/PRODUCTION-READINESS.md) : pas de route
    # /health côté web, /login est la page publique la plus légère à rendre
    # (pas de dépendance API bloquante côté SSR) — détecte un SSR qui répond
    # mais sert des pages cassées (ex. 500 systématique), pas juste un crash
    # process. Même approche que api : pas de curl/wget dans l'image Alpine.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3001/login',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - erp_saas_prod

  # Phase 10.6, docs/adr/0017-caddy-reverse-proxy-https.md : seul point
  # d'entrée réseau externe de la stack (api/web ne publient plus de port).
  # HTTPS automatique (obtention + renouvellement Let's Encrypt) pour tout
  # domaine public réel pointé vers ce VPS — aucune tâche cron à ajouter.
  caddy:
    image: caddy:2-alpine
    container_name: erp_saas_caddy_prod
    restart: unless-stopped
    mem_limit: ${CADDY_MEM_LIMIT:-128m}
    cpus: ${CADDY_CPU_LIMIT:-0.25}
    depends_on:
      - api
      - web
    environment:
      API_DOMAIN: ${API_DOMAIN}
      WEB_DOMAIN: ${WEB_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - erp_saas_caddy_data:/data
      - erp_saas_caddy_config:/config
    networks:
      - erp_saas_prod

networks:
  erp_saas_prod:

volumes:
  erp_saas_postgres_prod_data:
  # Persiste les certificats TLS obtenus (Let's Encrypt) : sans ce volume,
  # Caddy redemanderait un certificat neuf à chaque recréation du
  # conteneur, au risque de heurter le rate limit de Let's Encrypt.
  erp_saas_caddy_data:
  erp_saas_caddy_config:
