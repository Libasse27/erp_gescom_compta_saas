# Nom de projet Compose explicite : sans lui, Compose dérive un nom de
# projet du dossier du fichier ("docker"), IDENTIQUE à celui de
# docker-compose.dev.yml — deux stacks partageant alors le même espace de
# noms internes, chacune "recréant" (donc détruisant) les conteneurs de
# l'autre au moindre `up`. Vécu en vérifiant cette Phase 10.1 : `up -d
# postgres` sur ce fichier a détruit le conteneur postgres de dev
# (heureusement le volume nommé, distinct, a survécu).
name: erp_saas_prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: erp_saas_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - erp_saas_postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - erp_saas_prod

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: erp_saas_api_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TENANT_DATABASE_URL: ${TENANT_DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      PORT: 3000
      PAYMENT_WEBHOOK_SECRET_WAVE: ${PAYMENT_WEBHOOK_SECRET_WAVE}
      PAYMENT_WEBHOOK_SECRET_ORANGE_MONEY: ${PAYMENT_WEBHOOK_SECRET_ORANGE_MONEY}
      PAYMENT_WEBHOOK_SECRET_FREE_MONEY: ${PAYMENT_WEBHOOK_SECRET_FREE_MONEY}
      PAYMENT_WEBHOOK_SECRET_STRIPE: ${PAYMENT_WEBHOOK_SECRET_STRIPE}
      PAYMENT_WEBHOOK_SECRET_CARD: ${PAYMENT_WEBHOOK_SECRET_CARD}
      PAYMENT_GRACE_PERIOD_DAYS: ${PAYMENT_GRACE_PERIOD_DAYS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    # Publié directement pour l'instant (pas encore de reverse proxy — voir
    # Phase 10.6). À restreindre à 127.0.0.1 ou retirer une fois Caddy en
    # place devant l'API.
    ports:
      - "3000:3000"
    networks:
      - erp_saas_prod

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: erp_saas_web_prod
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    # Même remarque que le service api : publié directement en attendant la
    # Phase 10.6 (reverse proxy Caddy + HTTPS).
    ports:
      - "3001:3001"
    networks:
      - erp_saas_prod

networks:
  erp_saas_prod:

volumes:
  erp_saas_postgres_prod_data:
